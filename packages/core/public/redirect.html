<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating with Deriv...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #0e0e0e;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #ff444f;
            margin-bottom: 20px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ff444f;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            color: #666;
            margin: 20px 0;
        }
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .success {
            color: #2e7d32;
            background: #e8f5e9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Processing OAuth...</h1>
        <div class="spinner"></div>
        <div class="status" id="status">Authenticating your account...</div>
    </div>

    <script>
        // OAuth Redirect Handler for Third-Party Apps
        (function() {
            const statusEl = document.getElementById('status');
            
            try {
                // Parse URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                const accounts = [];
                const errors = [];
                
                // Check for error first
                if (urlParams.has('error')) {
                    const error = urlParams.get('error');
                    const errorDesc = urlParams.get('error_description');
                    throw new Error(`OAuth Error: ${error} - ${errorDesc || 'Unknown error'}`);
                }
                
                // Extract all accounts from URL parameters
                // Deriv returns multiple accounts as acct1, token1, acct2, token2, etc.
                let i = 1;
                while (urlParams.has(`acct${i}`)) {
                    const account = {
                        loginid: urlParams.get(`acct${i}`),
                        token: urlParams.get(`token${i}`),
                        currency: urlParams.get(`cur${i}`) || 'USD',
                        type: urlParams.get(`acct${i}`).startsWith('VR') ? 'demo' : 'real'
                    };
                    accounts.push(account);
                    i++;
                }
                
                if (accounts.length === 0) {
                    throw new Error('No accounts found in OAuth response');
                }
                
                statusEl.textContent = `Found ${accounts.length} account(s). Storing credentials...`;
                
                // Store accounts in localStorage (Deriv's expected format)
                const accountsObj = {};
                accounts.forEach(acc => {
                    accountsObj[acc.loginid] = {
                        token: acc.token,
                        currency: acc.currency,
                        is_virtual: acc.type === 'demo' ? 1 : 0,
                        session_start: new Date().getTime(),
                        excluded_until: '',
                        landing_company_name: acc.type === 'demo' ? 'virtual' : 'svg'
                    };
                });
                
                // Store in localStorage
                localStorage.setItem('client.accounts', JSON.stringify(accountsObj));
                
                // CRITICAL: Store the app_id that these tokens belong to!
                localStorage.setItem('config.app_id', '101333');
                localStorage.setItem('third_party.app_id', '101333');
                
                // Set active account (prefer real account over demo)
                const realAccount = accounts.find(acc => acc.type === 'real');
                const activeAccount = realAccount || accounts[0];
                
                if (activeAccount) {
                    localStorage.setItem('client.active_loginid', activeAccount.loginid);
                    localStorage.setItem('client.active_token', activeAccount.token);
                    sessionStorage.setItem('client.active_loginid', activeAccount.loginid);
                    sessionStorage.setItem('client.active_token', activeAccount.token);
                    
                    // Also store in the format some Deriv components expect
                    localStorage.setItem('active_loginid', activeAccount.loginid);
                    sessionStorage.setItem('active_loginid', activeAccount.loginid);
                    
                    // IMPORTANT: Store active_token for WebSocket connection
                    sessionStorage.setItem('active_token', activeAccount.token);
                    sessionStorage.setItem(`token_${activeAccount.loginid}`, activeAccount.token);
                }
                
                // Store all tokens for easy access
                accounts.forEach(acc => {
                    if (acc.type === 'real') {
                        localStorage.setItem('deriv_real_token', acc.token);
                    } else {
                        localStorage.setItem('deriv_demo_token', acc.token);
                    }
                });
                
                // Store full OAuth response for debugging
                const oauthData = {
                    accounts: accounts,
                    timestamp: new Date().toISOString(),
                    active_loginid: activeAccount.loginid
                };
                localStorage.setItem('oauth_response', JSON.stringify(oauthData));
                
                // Show success message
                statusEl.className = 'success';
                statusEl.textContent = `✅ Successfully authenticated! Redirecting to trading platform...`;
                
                // Log for debugging
                console.log('OAuth Success:', oauthData);
                
                // Redirect to main app after a short delay
                setTimeout(() => {
                    // Redirect to launch page which will then go to main app
                    // This ensures tokens are properly set before entering the main app
                    const redirectUrl = '/launch.html';
                    
                    // Mark that we've completed OAuth to prevent loops
                    sessionStorage.setItem('oauth_completed', 'true');
                    
                    // Store tokens one more time to ensure they persist
                    sessionStorage.setItem('active_token', activeAccount.token);
                    sessionStorage.setItem('active_loginid', activeAccount.loginid);
                    
                    console.log('OAuth redirect complete. Going to:', redirectUrl);
                    console.log('Active account:', activeAccount.loginid);
                    console.log('Token stored:', !!sessionStorage.getItem('active_token'));
                    
                    // Redirect to login-test page
                    window.location.href = redirectUrl;
                }, 2000);
                
            } catch (error) {
                console.error('OAuth Error:', error);
                statusEl.className = 'error';
                statusEl.innerHTML = `
                    <strong>Authentication Failed</strong><br>
                    ${error.message}<br><br>
                    <a href="/" style="color: #ff444f;">Return to Home</a>
                `;
                
                // Remove spinner on error
                document.querySelector('.spinner').style.display = 'none';
            }
        })();
    </script>
</body>
</html>
